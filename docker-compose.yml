services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stem-robotics-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=robotics_learning_db
      - DB_USERNAME=robotics_user
      - DB_PASSWORD=robotics_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - stem-network

  web:
    image: nginx:alpine
    container_name: stem-robotics-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - stem-network

  database:
    image: mysql:8.0
    container_name: stem-robotics-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: robotics_learning_db
      MYSQL_USER: robotics_user
      MYSQL_PASSWORD: robotics_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stem-network

  redis:
    image: redis:7-alpine
    container_name: stem-robotics-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stem-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: stem-robotics-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - stem-network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  stem-network:
    driver: bridge

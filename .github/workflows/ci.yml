name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pint y pruebas (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: robotics_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: robotics_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip
          coverage: none

      - run: composer validate --strict

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/pint --test

      - name: Migraciones y semillas
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force

      - run: vendor/bin/phpunit

      - name: Esquema SQL de demostración
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE robotics_demo'
          mysql -h 127.0.0.1 -uroot -proot robotics_demo < database/schema.sql
          mysql -h 127.0.0.1 -uroot -proot robotics_demo < database/seeds.sql
          DB_DATABASE=robotics_demo php database/verify_database.php

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose config --quiet

      - run: docker build -f docker/php/Dockerfile -t robotics-learning-platform .

      - name: Verificar PHP y extensiones de la imagen
        run: docker run --rm robotics-learning-platform php -m | grep -E '^(pdo_mysql|redis|gd|zip)$'

name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  php-lint:
    name: PHP Syntax & Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2']
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Validate Composer Configuration
        run: composer validate --no-check-all --no-check-lock

      - name: Syntax Linting (PHP Lint)
        run: |
          find app database routes tests -type f -name "*.php" -print0 | xargs -0 -n 1 -P 4 php -l

  database-verification:
    name: Database Schema & Seeds Verification (MySQL 8.0)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_secret
          MYSQL_DATABASE: robotics_learning_db
          MYSQL_USER: robotics_user
          MYSQL_PASSWORD: robotics_secret
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql
          coverage: none

      - name: Initialize DDL Schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot_secret robotics_learning_db < database/schema.sql

      - name: Populate Seed Dataset
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot_secret robotics_learning_db < database/seeds.sql

      - name: Verify Schema Integrity & Record Constraints
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: robotics_learning_db
          DB_USERNAME: root
          DB_PASSWORD: root_secret
        run: |
          php database/verify_database.php

  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
